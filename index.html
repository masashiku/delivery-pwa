<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配達管理テスト</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配達管理">
<meta name="theme-color" content="#ffffff">
<style>
body{font-family:system-ui;padding:16px;line-height:1.7;max-width:640px}
input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
button{padding:12px 16px;font-size:16px;margin:4px 4px 4px 0}
pre{background:#f2f2f2;padding:12px;white-space:pre-wrap;word-break:break-all}
h2{font-size:1.05rem;margin-top:24px}
</style>
</head>
<body>
<h1>通信テスト v0-5</h1>
<p id="s">SW: 確認中</p>

<h2>接続設定</h2>
<p>GASのウェブアプリURL</p>
<input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
<p>トークン</p>
<input id="tok" type="password" placeholder="発行した64桁の文字列">
<button id="save">保存</button>
<p id="state">未設定</p>

<h2>診断</h2>
<button id="diag">保存済みトークンを照合</button>

<h2>通信テスト</h2>
<button id="ping">ping送信</button>
<pre id="out">（未実行）</pre>

<script>
var KEY = 'dpwa_conf';

function loadConf() {
  try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
  catch (e) { return null; }
}
function refresh() {
  var c = loadConf();
  document.getElementById('state').textContent =
    c ? '保存済み（トークンは表示しません）' : '未設定';
  if (c) document.getElementById('url').value = c.url;
}
function out(t) { document.getElementById('out').textContent = t; }

// GAS側と同じ方式で短縮ハッシュを作る
function hashPrefix(s) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))
    .then(function (b) {
      return Array.from(new Uint8Array(b))
        .map(function (x) { return x.toString(16).padStart(2, '0'); })
        .join('').slice(0, 12);
    });
}

document.getElementById('save').onclick = function () {
  var url = document.getElementById('url').value.trim();
  var tok = document.getElementById('tok').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
    out('URLの形式が違います。'); return;
  }
  if (tok.length < 32) { out('トークンが短すぎます。'); return; }
  localStorage.setItem(KEY, JSON.stringify({ url: url, token: tok }));
  document.getElementById('tok').value = '';
  refresh();
  out('設定を保存しました。文字数: ' + tok.length);
};

document.getElementById('diag').onclick = function () {
  var c = loadConf();
  if (!c) { out('設定が未保存です。'); return; }
  hashPrefix(c.token).then(function (h) {
    out('保存済みトークン\n文字数: ' + c.token.length + '\nハッシュ: ' + h);
  });
};

document.getElementById('ping').onclick = function () {
  var c = loadConf();
  if (!c) { out('設定が未保存です。'); return; }
  out('送信中...');
  fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: c.token, action: 'ping', message: 'hello' })
  })
  .then(function (r) { return r.text(); })
  .then(function (t) { out(t); })
  .catch(function (e) { out('通信失敗: ' + e.message); });
};

var sw = document.getElementById('s');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(function () { sw.textContent = 'SW: 登録済み'; })
    .catch(function () { sw.textContent = 'SW: 登録失敗'; });
} else { sw.textContent = 'SW: 非対応'; }

refresh();
</script>
</body>
</html>
