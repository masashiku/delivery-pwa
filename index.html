<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配達管理</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配達管理">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<h1>売上入力 v1-2</h1>

<label for="date">日付</label>
<div class="row">
  <input id="date" type="date">
  <button id="backToday" class="small">今日に戻す</button>
</div>
<div id="dateNote" class="note" style="display:none"></div>

<label for="time">時間（4桁または3桁の数字）</label>
<input id="time" type="tel" inputmode="numeric" placeholder="1456">

<label for="amount">売上金額</label>
<input id="amount" type="tel" inputmode="numeric" placeholder="650">

<label>会社</label>
<div class="companies">
  <button data-code="う">う</button>
  <button data-code="で">で</button>
  <button data-code="ろ">ろ</button>
  <button data-code="め">め</button>
</div>

<button id="confirm" class="confirm">確定</button>
<div id="msg" class="msg"></div>

<div class="card">
  <div style="font-size:.85rem;color:#555">直前の登録</div>
  <div id="last">（まだありません）</div>
  <button id="resend" class="small" style="margin-top:8px">未送信を再送</button>
</div>

<div class="card" id="sum"></div>

<div class="card">
  <div style="font-size:.85rem;color:#555">本日の一覧（配達日時順）</div>
  <table><tbody id="list"></tbody></table>
</div>

<details>
  <summary>接続設定（<span id="confState">未設定</span>）</summary>
  <label for="confUrl">GASのウェブアプリURL</label>
  <input id="confUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="confTok">トークン</label>
  <input id="confTok" type="password" placeholder="控えてある64桁の文字列">
  <button id="confSave" class="small" style="margin-top:10px">保存</button>
</details>

<script src="./app.js"></script>
</body>
</html>
